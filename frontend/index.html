<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeRM</title>
    <script>
      // Applies the stored or operating system color scheme before the first paint.
      (function applyInitialColorScheme() {
        var storedColorScheme = window.localStorage.getItem('mantine-color-scheme-value');
        var systemColorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        var chosenColorScheme =
          storedColorScheme === 'light' || storedColorScheme === 'dark'
            ? storedColorScheme
            : systemColorScheme;
        document.documentElement.setAttribute('data-mantine-color-scheme', chosenColorScheme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
